<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content"
    />
    <title>Marcel SSH</title>
    <!-- 冷启动底色：JS 与样式表加载之前就把 <html> 涂成用户主题的外框色（缓存由
         lib/uiTheme.ts 的 applyUiTheme 写入），浅色主题不再先闪一块深色。没有缓存
         （首次启动）回退曜石的 zinc-950，与移动端 splash 背景 (@color/marcel_splash_bg)
         一致。主题应用器接管后会把它改成跟 --color-zinc-950 变量走。 -->
    <script>
      (function () {
        var bg = "#09090B";
        var scheme = "dark";
        try {
          var c = JSON.parse(
            localStorage.getItem("marcel.uiTheme.chrome") || "null",
          );
          if (c && /^#[0-9a-fA-F]{6}$/.test(c.background)) {
            bg = c.background;
            scheme = c.scheme === "light" ? "light" : "dark";
          }
        } catch (e) {}
        var s = document.documentElement.style;
        s.backgroundColor = bg;
        s.colorScheme = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
